  <h2 class="sec">Overview</h2>
  <p class="how" id="ovHow">動能＝3 個月年化相對年增：高出 0.3 個百分點以上為加速（紅），低 0.3 以上為降溫（藍）。點列可在 Components 拆開該項目。</p>

  <section id="brd" hidden>
    <h2 class="sec">Breadth</h2>
    <p class="how">把 PCE 拆成約 220 個細項，看有多少比例的漲幅超過 3%：比例越高，代表通膨越廣泛、越不是少數項目造成。這是聯準會官員判斷「底層通膨」的方法之一。</p>
    <p class="lede" id="brdTxt"></p>

<template id="tpl-gdp">
  <div class="meta"><b>USA</b> | <span id="dt"></span></div>
  <h1 id="hd"></h1>

  <h2 class="sec">Overview</h2>
  <p class="how">季增年率（SAAR）：季增率連乘四季。核心 GDP＝對國內民間買家的最終銷售（消費＋民間固定投資），排除波動大的存貨、淨出口與政府支出。</p>
  <div class="tblw"><table id="govt"></table></div>
  <p class="hlg" id="gLg"></p>

  <h2 class="sec" id="gcompo">Contributions</h2>
  <p class="how">各項對實質 GDP 成長的貢獻（百分點，BEA 官方數字），加總等於 GDP 成長。點色塊、圖例或表格的項目名稱往下拆；虛線框是本季的 GDPNow 即時預測。表格欄位跟著圖的期間：4Q、8Q 顯示每季，3Y 以上顯示每年各季的平均。</p>
  <div class="hv" id="gstk" style="margin:12px 0 12px"></div>
  <div class="tblw"><table id="gtbl"></table></div>
  <p class="hlg" id="gLg2"></p>

  <h2 class="sec">Analysis</h2>
  <div id="gp1"></div>
  <div class="charts">
    <div class="hv" id="gch1"></div>
    <div class="hv" id="gch2"></div>
  </div>
  <div class="charts">
    <div class="hv" id="gch3"></div>
    <div class="hv" id="gch4"></div>
  </div>

  <div id="lead"></div>

  <h2 class="sec">Revisions</h2>
  <p class="how">BEA 每季發布三次估計（初估、二估、三估），之後年度修正仍會改動；市場預期取自 investing.com 經濟日曆。</p>
  <div class="tblw"><table id="grev"></table></div>
  <p class="note">資料來源：美國經濟分析局（BEA）國民所得帳；即時預測為亞特蘭大聯準銀行 GDPNow。2025 年第 3 季因政府停擺延後，只發布兩次估計。</p>
</template>

<template id="tpl-liq">
  <div class="meta"><b>USA</b> | <span id="dt"></span></div>
  <h1 id="hd"></h1>
  <div id="lp1"></div>

  <h2 class="sec">Overview</h2>
  <div class="tblw"><table id="lw"></table></div>
  <div class="tblw"><table id="ld"></table></div>
  <p class="hlg">淨流動性＝聯準會總資產 − TGA − ON RRP（不含外國官方逆回購），衡量留在民間金融體系的央行資金。bp＝基點（0.01 個百分點）。</p>

  <h2 class="sec">Rate corridor</h2>
  <p class="how">聯準會用三個管理利率圍出隔夜利率的區間：上限是常備附買回（SRF，即 ON RP）最低利率，下限是 ON RRP 利率，中間是準備金利率 IORB。SOFR 與 EFFR 是市場利率；若 SOFR 經常貼近或超過 SRF 利率，代表準備金不足、資金緊。</p>
  <div class="charts" style="grid-template-columns:1fr"><div class="hv" id="lc1"></div></div>
  <div class="charts">
    <div class="hv" id="lc2"></div>
    <div class="hv" id="lc3"></div>
  </div>

  <h2 class="sec">Reserve ampleness</h2>
  <p class="how">準備金是否「充足」（ample）看兩件事：準備金占銀行總資產的比率，以及 EFFR 對準備金變動的敏感度。紐約聯準銀行的準備金需求彈性（RDE）衡量準備金增加相當於銀行資產 1% 時，EFFR 減 IORB 會變動幾個 bp：接近 0 是「過剩」（abundant），小幅為負是「充足」，明顯為負代表準備金開始「稀缺」（scarce），利率對準備金變動變得敏感。散布圖中的水平分層，部分來自聯準會對 IORB 在目標區間內位置的技術性調整，並非準備金需求本身的變化。</p>
  <div class="charts">
    <div class="hv" id="la1"></div>
    <div class="hv" id="la2"></div>
  </div>
  <div class="charts" style="grid-template-columns:1fr"><div class="hv" id="la3"></div></div>

  <h2 class="sec">Fed balance sheet</h2>
  <p class="how">H.4.1 每週四公布週三的資產負債表。資產端看縮表（QT）速度；負債端的準備金、TGA 與 ON RRP 三者互相消長：總資產不變時，TGA 或 ON RRP 增加，準備金就減少。</p>
  <div class="charts">
    <div class="hv" id="lb1"></div>
    <div class="hv" id="lb2"></div>
  </div>
  <div class="charts">
    <div class="hv" id="lb3"></div>
    <div class="hv" id="lb4"></div>
  </div>

  <h2 class="sec">Treasury cash and backstops</h2>
  <p class="how">TGA 取自財政部每日國庫報表，比 H.4.1 早一週看到變化；繳稅日與發債結算日 TGA 會跳升、準備金下降。貼現窗口與附買回的使用量平時很小，突然放大代表有機構需要緊急資金。</p>
  <div class="charts">
    <div class="hv" id="lt1"></div>
    <div class="hv" id="lt2"></div>
  </div>
  <p class="note">資料來源：聯準會理事會 H.4.1 與 IORB（經聖路易聯準銀行 FRED 提供；理事會的資料下載服務即將停用並指向 FRED）；紐約聯準銀行 SOFR、EFFR、ON RRP 與附買回操作；美國財政部 Daily Treasury Statement；銀行總資產取自聯準會理事會 H.8（所有商業銀行，季調）；準備金需求彈性取自紐約聯準銀行 Reserve Demand Elasticity。利率互換（IRS）屬授權商業資料，不在本頁範圍。</p>
</template>
<template id="tpl-ov">

  <div id="ovapp">

<div id="appOv">
<section class="ovsec" aria-labelledby="oVerT">

</section>

</div>

</details>

<section class="panel wide">
  <div class="ph">
    <h2>Dashboard</h2>
    <span class="hint">點選列前往該分頁 · 趨勢＝趨勢線近 6 個月（GDP 為 2 季）的變化</span>
  </div>
  <div class="tw" style="max-height:none"><table id="oTbl"></table></div>
  <p class="hlg" id="oLg"></p>
  <div class="legend"><span>趨勢線：通膨、成長率用年增；PMI 與就業流量用 6 個月平均；失業率用 3 個月平均</span><span>近期 vs 趨勢：最新單期（或 3 個月年化）相對趨勢線的位置，代表是否正在轉折</span><span>顏色依全站規則：紅＝不利方向</span></div>
</section>

<section class="panel wide">
  <div class="ph">
    <h2>Trends</h2>
    <span class="hint">細線＝單期數值（雜訊大），粗線＝趨勢線；虛線＝目標或基準</span>
  </div>
  <div id="oGrid"></div>
</section>

<div id="lead"></div>

<footer class="notes">
  <div><b>用法</b> 這一頁不判斷政策，只呈現各面向「往哪裡走」。每張小圖的粗線是趨勢線，細線是每月（或每季）數字；單月偏離趨勢常會被下個月抵銷，連續數月朝同一方向才算趨勢改變。點圖或列可進入該資料的分頁看細節。</div>
  <div><b>趨勢判斷</b> 趨勢線近 6 個月（GDP 為近 2 季）的變化超過各指標的門檻，才標為上升或下降，否則為持平。門檻：通膨 0.2 個百分點、PMI 1 點、非農就業 25k、失業率 0.2 個百分點、初領 10k、時薪 0.2 個百分點、GDP 0.5 個百分點、零售 1 個百分點。</div>
  <div><b>資料</b> 全部取自本頁各分頁的資料集，更新時間以各分頁為準；行事曆中已過公布日但頁面尚未更新的項目會標示「待更新」。PPI 公布日取自第三方行事曆，尚未在 BLS 網站確認。</div>
</footer>
